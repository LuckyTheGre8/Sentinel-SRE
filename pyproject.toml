[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sentinel-ops"
version = "0.1.0"
description = "Local incident investigation and confirmation-bound sandbox remediation"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic==2.12.3",
  "httpx==0.28.1",
  "uagents==0.25.5",
  "uagents-core==0.4.9",
  "fastapi==0.119.1",
  "uvicorn==0.38.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.14.2", "mypy==1.18.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
tmp_path_retention_count = 2

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_ops"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/demo_service", "/docs", "/README.md", "/pyproject.toml", "/uv.lock", "/.python-version", "/.env.example", "/.gitignore"]
